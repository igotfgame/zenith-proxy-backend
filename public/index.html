   border-color: #60a5fa;       box-shadow:         0 0 0 3px rgba(96,165,250,.12);     }      .primary-button {       width: 100%;       height: 48px;        border: 0;       border-radius: 12px;        cursor: pointer;        background:         linear-gradient(           135deg,           #2563eb,           #7c3aed         );        color: white;       font-weight: 700;        transition:         transform .15s,         opacity .15s;     }      .primary-button\:hover {       transform: translateY(-1px);     }      .primary-button\:disabled {       opacity: .5;       cursor: wait;     }      .message {       min-height: 20px;       margin-top: 14px;        text-align: center;       color: #f87171;       font-size: 13px;     }      /\* -------------------------------------------------------        APP     ------------------------------------------------------- \*/      #app {       display: none;       flex: 1;       flex-direction: column;       min-height: 0;     }      .topbar {       height: 64px;       flex-shrink: 0;        display: flex;       align-items: center;        padding: 0 18px;        border-bottom:         1px solid rgba(255,255,255,.08);        background: #0b1020;     }      .brand {       font-size: 22px;       font-weight: 800;        background:         linear-gradient(           90deg,           #60a5fa,           #a78bfa         );        -webkit-background-clip: text;       background-clip: text;       color: transparent;     }      .topbar-spacer {       flex: 1;     }      #clock {       margin-right: 18px;       color: #94a3b8;       font-size: 13px;     }      .logout {       border: 1px solid #263247;       border-radius: 9px;        padding: 8px 12px;        cursor: pointer;        background: #111827;       color: #cbd5e1;     }      .workspace {       display: flex;       flex: 1;       min-height: 0;     }      .sidebar {       width: 230px;       flex-shrink: 0;        padding: 16px;        border-right:         1px solid rgba(255,255,255,.08);        background: #080d19;     }      .nav-title {       margin-bottom: 10px;        color: #64748b;       font-size: 11px;       font-weight: 700;       text-transform: uppercase;       letter-spacing: 1px;     }      .nav-button {       width: 100%;       margin-bottom: 8px;        padding: 11px 12px;        border: 0;       border-radius: 10px;        text-align: left;        cursor: pointer;        background: transparent;       color: #cbd5e1;     }      .nav-button\:hover,     .nav-button.active {       background: #151e31;       color: white;     }      .content {       display: flex;       flex: 1;       min-width: 0;       min-height: 0;     }      /\* -------------------------------------------------------        BROWSER     ------------------------------------------------------- \*/      #browserView {       display: flex;       flex-direction: column;        width: 100%;       height: 100%;     }      .browser-bar {       display: flex;       gap: 8px;        padding: 10px;        border-bottom:         1px solid rgba(255,255,255,.08);        background: #0b1220;     }      .browser-input {       flex: 1;        height: 42px;        padding: 0 14px;        border: 1px solid #263247;       border-radius: 10px;        outline: none;        background: #070d1  \</style>

\<body>

&#x20; \<!-- ======================================================
&#x20;      INVITATION GATE
&#x20; \======================================================= -->

&#x20; \<div id="gate">

```
<div class="gate-card">

  <div class="logo">
    Zenith
  </div>

  <div class="subtitle">
    Private access portal
  </div>

  <form id="loginForm">

    <div class="field">
      <input
        id="invitation"
        type="password"
        placeholder="Invitation code"
        autocomplete="off"
        required
      >
    </div>

    <div
      id="accountFields"
      style="display:none;"
    >

      <div class="field">
        <input
          id="username"
          type="text"
          placeholder="Username"
          autocomplete="username"
        >
      </div>

      <div class="field">
        <input
          id="realName"
          type="text"
          placeholder="Your name"
          autocomplete="name"
        >
      </div>

      <div class="field">
        <input
          id="password"
          type="password"
          placeholder="Password"
          autocomplete="current-password"
        >
      </div>

    </div>

    <button
      id="continueButton"
      class="primary-button"
      type="submit"
    >
      Continue
    </button>

  </form>

  <div
    id="gateMessage"
    class="message"
  ></div>

</div>
```

&#x20; \</div>

&#x20; \<!-- ======================================================
&#x20;      APP
&#x20; \======================================================= -->

&#x20; \<div id="app">

```
<div class="topbar">

  <div class="brand">
    Zenith
  </div>

  <div class="topbar-spacer"></div>

  <div id="clock">
    --:--:--
  </div>

  <button
    class="logout"
    onclick="logout()"
  >
    Log out
  </button>

</div>


<div class="workspace">

  <aside class="sidebar">

    <div class="nav-title">
      Zenith
    </div>

    <button
      class="nav-button active"
      id="homeButton"
      onclick="showHome()"
    >
      Home
    </button>

    <button
      class="nav-button"
      id="browserButton"
      onclick="showBrowser()"
    >
      Browser
    </button>

    <button
      class="nav-button"
      id="chatButton"
      onclick="showChat()"
    >
      Chat
    </button>

  </aside>


  <main class="content">

    <!-- HOME -->

    <section id="homeView">

      <div class="home-title">
        Welcome to Zenith
      </div>

      <div class="home-text">
        Search the web through the Zenith proxy.
        Enter a website or search phrase below.
      </div>

      <div class="quick-search">

        <input
          id="homeSearch"
          type="text"
          placeholder="Search the web..."
          onkeydown="
            if(event.key === 'Enter') {
              performSearch();
            }
          "
        >

        <button
          onclick="performSearch()"
        >
          Search
        </button>

      </div>

    </section>


    <!-- BROWSER -->

    <section id="browserView">

      <div class="browser-bar">

        <input
          id="addressBar"
          class="browser-input"
          type="text"
          placeholder="Enter a URL or search..."
          autocomplete="off"
          onkeydown="
            if(event.key === 'Enter') {
              navigate();
            }
          "
        >

        <button
          class="go-button"
          onclick="navigate()"
        >
          Go
        </button>

      </div>

      <iframe
        id="browserFrame"
        title="Zenith Browser"
      ></iframe>

    </section>


    <!-- CHAT -->

    <section id="chatView">

      <div id="messages"></div>

      <div class="chat-input">

        <input
          id="chatMessage"
          type="text"
          placeholder="Write a message..."
          onkeydown="
            if(event.key === 'Enter') {
              sendMessage();
            }
          "
        >

        <button
          onclick="sendMessage()"
        >
          Send
        </button>

      </div>

    </section>

  </main>

</div>
```

&#x20; \</div>

&#x20; \<script>      // ========================================================     // ZENITH BACKEND     // ========================================================      const BACKEND =       "[https://zenith-proxy-backend.ethiodeploy.app](https://zenith-proxy-backend.ethiodeploy.app)";       // ========================================================     // STATE     // ========================================================      let invitationAccepted = false;     let sessionToken = null;     let currentUser = null;       // ========================================================     // ELEMENTS     // ========================================================      const gate =       document.getElementById("gate");      const app =       document.getElementById("app");      const loginForm =       document.getElementById("loginForm");      const invitation =       document.getElementById("invitation");      const accountFields =       document.getElementById("accountFields");      const username =       document.getElementById("username");      const realName =       document.getElementById("realName");      const password =       document.getElementById("password");      const continueButton =       document.getElementById("continueButton");      const gateMessage =       document.getElementById("gateMessage");       // ========================================================     // INVITATION / LOGIN     // ========================================================      loginForm.addEventListener(       "submit",       async function(event) {          event.preventDefault();          gateMessage.textContent = "";          if (!invitationAccepted) {            const code =             invitation.value.trim();            /\*            \* Your current invitation code is 9999.            \*            \* This is intentionally checked here so the            \* frontend works even if your backend does not            \* provide an invitation API.            \*/            if (code !== "9999") {              gateMessage.textContent =               "Invalid invitation code.";              return;           }            invitationAccepted = true;            accountFields.style.display =             "block";            invitation.type =             "text";            invitation.disabled =             true;            continueButton.textContent =             "Enter Zenith";            gateMessage.style.color =             "#4ade80";            gateMessage.textContent =             "Invitation accepted. Create or enter your account.";            return;         }          const user =           username.value.trim();          const name =           realName.value.trim();          const pass =           password.value;          if (!user || !name || !pass) {            gateMessage.style.color =             "#f87171";            gateMessage.textContent =             "Enter your username, name, and password.";            return;         }          /\*          \* The backend authentication API can be connected          \* separately. For now we establish the frontend          \* session locally so the Zenith interface can run.          \*/          currentUser = {           username: user,           realName: name         };          sessionToken =           "local-" +           Date.now();          localStorage.setItem(           "zenithUser",           JSON.stringify(currentUser)         );          localStorage.setItem(           "zenithSession",           sessionToken         );          openApp();       }     );       // ========================================================     // APP STARTUP     // ========================================================      function checkSavedSession() {        try {          const savedUser =           localStorage.getItem(             "zenithUser"           );          const savedSession =           localStorage.getItem(             "zenithSession"           );          if (           savedUser &&           savedSession         ) {            currentUser =             JSON.parse(savedUser);            sessionToken =             savedSession;            openApp();         }        } catch {         localStorage.removeItem(           "zenithUser"         );          localStorage.removeItem(           "zenithSession"         );       }     }       function openApp() {        gate.style.display =         "none";        app.style.display =         "flex";        showHome();       updateClock();     }       // ========================================================     // LOGOUT     // ========================================================      function logout() {        localStorage.removeItem(         "zenithUser"       );        localStorage.removeItem(         "zenithSession"       );        currentUser = null;       sessionToken = null;       invitationAccepted = false;        location.reload();     }       // ========================================================     // NAVIGATION     // ========================================================      function hideViews() {        document.getElementById(         "homeView"       ).style.display = "none";        document.getElementById(         "browserView"       ).style.display = "none";        document.getElementById(         "chatView"       ).style.display = "none";        document         .querySelectorAll(".nav-button")         .forEach(button => {           button.classList.remove(             "active"           );         });     }       function showHome() {        hideViews();        document.getElementById(         "homeView"       ).style.display = "block";        document.getElementById(         "homeButton"       ).classList.add("active");     }       function showBrowser() {        hideViews();        document.getElementById(         "browserView"       ).style.display = "flex";        document.getElementById(         "browserButton"       ).classList.add("active");        document         .getElementById("addressBar")         .focus();     }       function showChat() {        hideViews();        document.getElementById(         "chatView"       ).style.display = "flex";        document.getElementById(         "chatButton"       ).classList.add("active");        loadMessages();     }       // ========================================================     // SEARCH / BROWSER     // ========================================================      function normalizeTarget(input) {        input =         String(input || "").trim();        if (!input) {         return "";       }        /\*        \* Already a URL.        \*/        if (         /^https?:\\/\\//i.test(input)       ) {         return input;       }        /\*        \* Looks like a domain.        \*/        if (         /^[a-z0-9.-]+\\.[a-z]{2,}(\\/.\*)?$/i.test(input)       ) {         return "https\://" + input;       }        /\*        \* Otherwise perform a web search.        \*/        return (         "[https://www.google.com/search?q=](https://www.google.com/search?q=)" +         encodeURIComponent(input)       );     }       function navigate() {        const input =         document           .getElementById("addressBar")           .value;        const target =         normalizeTarget(input);        if (!target) {         return;       }        const proxyUrl =         BACKEND +         "/proxy?url=" +         encodeURIComponent(target);        document         .getElementById("browserFrame")         .src = proxyUrl;        showBrowser();     }       function performSearch() {        const input =         document           .getElementById("homeSearch")           .value;        document         .getElementById("addressBar")         .value = input;        showBrowser();        navigate();     }       // ========================================================     // CHAT     // ========================================================      function loadMessages() {        /\*        \* Chat is intentionally kept local until the backend        \* chat API is connected.        \*/        const saved =         JSON.parse(           localStorage.getItem(             "zenithChat"           ) || "[]"         );        renderMessages(saved);     }       function renderMessages(messages) {        const container =         document.getElementById(           "messages"         );        container.innerHTML = "";        messages.forEach(message => {          const row =           document.createElement("div");          row\.className =           "message-row";          const user =           document.createElement("div");          user.className =           "message-user";          user.textContent =           message.username;          const content =           document.createElement("div");          content.className =           "message-content";          content.textContent =           message.content;          row\.appendChild(user);         row\.appendChild(content);          container.appendChild(row);       });        container.scrollTop =         container.scrollHeight;     }       function sendMessage() {        const input =         document.getElementById(           "chatMessage"         );        const text =         input.value.trim();        if (!text) {         return;       }        const messages =         JSON.parse(           localStorage.getItem(             "zenithChat"           ) || "[]"         );        messages.push({         username:           currentUser?.username ||           "User",          content: text,          time:           new Date().toISOString()       });        localStorage.setItem(         "zenithChat",         JSON.stringify(           messages.slice(-100)         )       );        input.value = "";        renderMessages(         messages.slice(-100)       );     }       // ========================================================     // CLOCK     // ========================================================      function updateClock() {        const clock =         document.getElementById(           "clock"         );        const now =         new Date();        clock.textContent =         now\.toLocaleTimeString(           undefined,           {             hour: "numeric",             minute: "2-digit",             second: "2-digit"           }         );     }       setInterval(       updateClock,       1000     );       // ========================================================     // INITIALIZE     // ========================================================      checkSavedSession();    \</script>
