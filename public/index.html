<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Zenith Proxy</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #080d0a;
      color: white;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
    }

    .toolbar {
      height: 62px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      background: #202622;
      border-bottom: 1px solid #37423b;
    }

    .logo {
      font-weight: 900;
      letter-spacing: 3px;
      color: #c7dfcd;
      padding: 0 10px;
    }

    button {
      border: 1px solid #4a574e;
      background: #29312c;
      color: white;
      border-radius: 8px;
      padding: 10px 13px;
      cursor: pointer;
    }

    button:hover {
      background: #39443d;
    }

    #address {
      flex: 1;
      min-width: 0;
      height: 40px;
      border-radius: 22px;
      border: 1px solid #4c5a51;
      background: #151c18;
      color: white;
      padding: 0 17px;
      outline: none;
    }

    #address:focus {
      border-color: #7db58d;
    }

    #status {
      height: 29px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      padding: 0 14px;
      background: #101711;
      color: #9caf9f;
      font-size: 12px;
      border-bottom: 1px solid #29342c;
    }

    #browser {
      flex: 1;
      min-height: 0;
      width: 100%;
      border: 0;
      background: white;
    }

    .home {
      position: absolute;
      inset: 91px 0 0 0;
      display: flex;
      justify-content: center;
      align-items: center;
      background:
        radial-gradient(
          ellipse at center,
          #24452d,
          #0a140d 70%
        );
    }

    .center {
      width: min(620px, 90vw);
      text-align: center;
    }

    .wordmark {
      font-size: clamp(45px, 8vw, 78px);
      font-weight: 300;
      letter-spacing: .3em;
      padding-left: .3em;
      color: #d8e7db;
    }

    .subtitle {
      color: #aebfaf;
      margin: 12px 0 28px;
    }

    .search {
      display: flex;
      gap: 8px;
      padding: 8px;
      background: #17231bd9;
      border: 1px solid #8ba99255;
      border-radius: 13px;
    }

    .search input {
      flex: 1;
      min-width: 0;
      border: 0;
      outline: 0;
      background: transparent;
      color: white;
      padding: 12px;
    }

    .search button {
      background: #477b55;
      border: 0;
    }
  </style>
</head>

<body>

  <div class="toolbar">
    <div class="logo">ZENITH</div>

    <button id="back">‹</button>
    <button id="forward">›</button>
    <button id="reload">↻</button>

    <input
      id="address"
      placeholder="Search or enter a website..."
      autocomplete="off"
    >

    <button id="go">Go</button>
  </div>

  <div id="status">
    Starting Zenith Proxy...
  </div>

  <iframe
    id="browser"
    allow="fullscreen; autoplay; gamepad; clipboard-read; clipboard-write"
  ></iframe>

  <div class="home" id="home">
    <div class="center">

      <div class="wordmark">
        zenith
      </div>

      <div class="subtitle">
        Search the web freely.
      </div>

      <div class="search">

        <input
          id="homeSearch"
          placeholder="Search the web or enter a URL..."
        >

        <button id="homeGo">
          Search
        </button>

      </div>

    </div>
  </div>

  <script src="/controller/controller.api.js"></script>
  <script src="/utils/scramjet-utils.js"></script>

  <script type="module" src="/js/engine.js"></script>

</body>
</html>
